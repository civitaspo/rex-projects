[package]
name = "rex-projects"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/civitaspo/rex-projects"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4.3"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

