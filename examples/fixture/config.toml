schema_version = 1

[adapters.tickets]
kind = "command"
command = ["/absolute/path/to/ticket-adapter"]

[adapters.tickets.status_values]
triage = "Triage"
backlog = "Backlog"
ready = "ToDo"
in_progress = "In Progress"
in_review = "In Review"
done = "Done"
canceled = "Canceled"

[repositories.example]
clone_url = "https://example.invalid/team/example.git"
base_branch = "main"
forge = "github"

[repositories.example.merge]
auto_merge = false
instructions = "Follow the repository's documented merge procedure."

[operation_recipes.docs_only]
required_stages = ["planning", "implementation", "review", "merge", "postmortem"]
required_evidence = ["plan", "review", "merge_assessment", "postmortem_publication"]
targets = []
not_required_reason = "This fixture has no deployed runtime target."

[projects.goal_project]
mode = "goal"
ticket_adapter = "tickets"
ticket_scope = { project = "example-goal" }
repositories = ["example"]

[projects.goal_project.goal]
revision = 1
statement = "Deliver the example migration."
acceptance = ["The updated interface passes its documented checks."]

[projects.goal_project.roles]
supervisor = "judgment_claude"
coordinator = "judgment_claude"
planner = "judgment_claude"
worker = "worker_codex"
reviewer = "judgment_claude"
merge_decision = "judgment_claude"
operator = "judgment_claude"
postmortem = "judgment_claude"

[projects.operations_project]
mode = "operations"
ticket_adapter = "tickets"
ticket_scope = { project = "example-operations" }
repositories = ["example"]
operation_matches = [{ labels_all = ["docs"], recipe = "docs_only" }]

[projects.operations_project.roles]
supervisor = "judgment_claude"
coordinator = "judgment_claude"
planner = "judgment_claude"
worker = "worker_codex"
reviewer = "judgment_claude"
merge_decision = "judgment_claude"
operator = "judgment_claude"
postmortem = "judgment_claude"
