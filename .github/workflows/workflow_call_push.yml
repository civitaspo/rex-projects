name: Push checks (workflow_call)
on:
  workflow_call:
permissions: {}
jobs:
  build:
    uses: ./.github/workflows/wc-build.yml
    permissions:
      contents: read
  checks:
    uses: ./.github/workflows/wc-checks.yml
    permissions:
      contents: read
  tests:
    uses: ./.github/workflows/wc-tests.yml
    permissions:
      contents: read
